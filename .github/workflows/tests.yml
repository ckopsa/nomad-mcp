name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "unittest name tests.<module>[.Class[.test]]; empty runs all"
        required: false
        default: ""

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No install step: the server and its tests are the standard library.
      - name: Run the tests
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "${ONLY:-}" ]; then exec python -m unittest -v; fi
          [[ "$ONLY" =~ ^tests(\.[A-Za-z_][A-Za-z0-9_]*)+$ ]] || { echo "bad only: $ONLY" >&2; exit 2; }
          python -m unittest -v "$ONLY"
