[project]
name = "nomad-mcp"
version = "0.1.0"
description = "A small, read-only MCP server for troubleshooting a Nomad cluster."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
# None, on purpose: the server is the standard library and nothing else.
dependencies = []

[project.scripts]
nomad-mcp = "nomadmcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nomadmcp"]
